<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products | StockSphere</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/products.css') }}">

</head>
<form method="GET" action="/products" class="search-form">

    <input
        type="text"
        name="search"
        placeholder="Search products..."
    >

    <button type="submit" class="add-btn">
        Search
    </button>

</form>

<br>

<body>

    <div class="container">

        <div class="header">

            <h1>📦 Products</h1>

            <a href="/add-product" class="add-btn">+ Add Product</a>

        </div>

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody>

    {% for product in products %}

    <tr>

        <td>{{ product.id }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.category }}</td>
        <td>₹{{ product.price }}</td>
        <td>{{ product.quantity }}</td>

        <td>

            <a href="/edit-product/{{ product.id }}"
   class="edit-btn">
    Edit
</a>
            <a href="/delete-product/{{ product.id }}"
   class="delete-btn"
   onclick="return confirm('Are you sure you want to delete this product?')">
    Delete
</a>

        </td>

    </tr>

    {% endfor %}

</tbody>

        </table>

        <br>

        <a href="/dashboard" class="back-btn">← Back to Dashboard</a>

    </div>

</body>

</html>
