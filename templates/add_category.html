<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Add Category</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='products.css') }}">

</head>

<body>

<div class="container">

    <h1>Add Category</h1>

    <form method="POST">

        <label>Category Name</label>

        <input
            type="text"
            name="name"
            required
        >

        <br><br>

        <button
            type="submit"
            class="add-btn">

            Save Category

        </button>

    </form>

    <br>

    <a href="/categories"
       class="back-btn">

       ← Back

    </a>

</div>

</body>

</html>
